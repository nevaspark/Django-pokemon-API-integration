version: "3.9"

services:
  # PostgreSQL database for Kong
  kong-database:
    image: postgres:15-alpine
    container_name: kong-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KONG_DATABASE_USER:-kong}
      POSTGRES_PASSWORD: ${KONG_DATABASE_PASSWORD:-kong}
      POSTGRES_DB: ${KONG_DATABASE_NAME:-kong}
    volumes:
      - kong-database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KONG_DATABASE_USER:-kong}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kong-network

  # Kong database migrations
  kong-migration:
    image: kong:3.5
    container_name: kong-migration
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: ${KONG_DATABASE_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_DATABASE_PASSWORD:-kong}
      KONG_PG_DATABASE: ${KONG_DATABASE_NAME:-kong}
    command: kong migrations bootstrap
    restart: on-failure
    networks:
      - kong-network

  # Kong API Gateway
  kong:
    image: kong:3.5
    container_name: kong-gateway
    restart: unless-stopped
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: ${KONG_DATABASE_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_DATABASE_PASSWORD:-kong}
      KONG_PG_DATABASE: ${KONG_DATABASE_NAME:-kong}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
    ports:
      - "8000:8000"   # Proxy port
      - "8443:8443"   # Proxy SSL port
      - "8001:8001"   # Admin API port
      - "8444:8444"   # Admin API SSL port
      - "8002:8002"   # Kong Manager port
      - "8445:8445"   # Kong Manager SSL port
    volumes:
      - ./kong/init-kong.yml:/kong/declarative/init-kong.yml
    networks:
      - kong-network

  # Card Service (Django Pokemon API)
  card-service:
    build: .
    container_name: card-service
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - PAGE_SIZE=${PAGE_SIZE:-24}
      - CACHE_TTL=${CACHE_TTL:-3600}
      - POKEAPI_BASE_URL=${POKEAPI_BASE_URL:-https://pokeapi.co/api/v2}
      - PORT=8000
    ports:
      - "8003:8000"
    volumes:
      - .:/app
    depends_on:
      - kong-database
    networks:
      - kong-network
    command: >
      sh -c "python manage.py migrate --noinput || true &&
             python manage.py collectstatic --noinput || true &&
             gunicorn pokedex_project.wsgi:application --bind 0.0.0.0:8000 --workers 3"

volumes:
  kong-database-data:
    driver: local

networks:
  kong-network:
    driver: bridge